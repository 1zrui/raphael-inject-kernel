name: Build Raphael Kernel with Frame Injection

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout CI repo (patch files)
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev \
            lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 \
            libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python-is-python3 device-tree-compiler

      - name: Clone kernel source
        run: |
          git clone --depth 1 --branch lineage-23.2 \
            https://github.com/LineageOS/android_kernel_xiaomi_sm8150.git kernel
          cd kernel
          git config core.longpaths true

      - name: Apply frame injection patch
        run: |
          cd kernel
          git apply --verbose ../inject.patch
          echo "=== verify inject files ==="
          ls -l drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_inject.c
          ls -l drivers/staging/qcacld-3.0/core/wma/src/wma_frame_inject.c
          grep -c "FRAME_INJECTION" drivers/staging/qcacld-3.0/configs/default_defconfig

      - name: Clone clang toolchain
        run: |
          mkdir -p tc
          git clone --depth 1 -b lineage-20.0 \
            https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git tc/clang
          chmod +x tc/clang/bin/* 2>/dev/null || true
          ./tc/clang/bin/clang --version | head -3

      - name: Clone GCC toolchain (LLVM toolchain needs aarch64 binutils for objdump fallback)
        continue-on-error: true
        run: |
          git clone --depth 1 -b lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git tc/gcc64
          chmod +x tc/gcc64/bin/* 2>/dev/null || true
          ./tc/gcc64/bin/aarch64-linux-android-gcc --version | head -2

      - name: Build kernel
        run: |
          cd kernel
          export PATH="$PWD/../tc/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC="clang"
          export CLANG_TRIPLE="aarch64-linux-gnu-"
          export CROSS_COMPILE="aarch64-linux-gnu-"
          export LD="ld.lld"
          export AR="llvm-ar"
          export NM="llvm-nm"
          export OBJCOPY="llvm-objcopy"
          export OBJDUMP="llvm-objdump"
          export STRIP="llvm-strip"
          export LLVM=1
          export LLVM_IAS=0

          make O=out ARCH=arm64 vendor/sm8150-perf_defconfig
          echo "=== merging fragments (LineageOS TARGET_KERNEL_CONFIG order) ==="
          ARCH=arm64 scripts/kconfig/merge_config.sh -m -O out out/.config \
            arch/arm64/configs/vendor/xiaomi/sm8150-common.config \
            arch/arm64/configs/vendor/xiaomi/raphael.config
          make O=out ARCH=arm64 olddefconfig
          echo "=== verify key configs ==="
          grep -E "CONFIG_MACH_XIAOMI_RAPHAEL|CONFIG_MACH_XIAOMI_SM8150|CONFIG_MFD_SPK_ID|CONFIG_QCA_CLD_WLAN|CONFIG_SND_SOC_CS35L41" out/.config || echo "WARN: some configs missing"
          echo "=== inject config check ==="
          grep -n "FRAME_INJECTION" drivers/staging/qcacld-3.0/configs/default_defconfig || echo "WARN: inject config not set"
          set +e
          make O=out ARCH=arm64 -j$(nproc) Image 2>&1 | tee ../build-img.log
          RC_IMG=${PIPESTATUS[0]}
          echo "=== Image build rc: $RC_IMG ==="
          set -e
          echo "=== errors in image build ==="
          grep -nE "error:|undefined symbol|Error [0-9]" ../build-img.log | head -25 || echo "(none)"
          if [ $RC_IMG -ne 0 ]; then exit $RC_IMG; fi

      - name: Package artifacts
        if: always()
        run: |
          mkdir -p artifacts
          if [ -f kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp kernel/out/arch/arm64/boot/Image.gz-dtb artifacts/
          fi
          if [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
            cp kernel/out/arch/arm64/boot/Image.gz artifacts/
          fi
          if [ -f kernel/out/arch/arm64/boot/Image ]; then
            cp kernel/out/arch/arm64/boot/Image artifacts/
          fi
          if [ -f kernel/out/drivers/staging/qcacld-3.0/wlan.ko ]; then
            cp kernel/out/drivers/staging/qcacld-3.0/wlan.ko artifacts/
          fi
          find kernel/out -name "wlan.ko" -exec cp {} artifacts/ \; 2>/dev/null || true
          find kernel/out -name "*.dtbo" -exec cp {} artifacts/ \; 2>/dev/null || true
          find kernel/out -name "sm8150*xiaomi*.dtb" -exec cp {} artifacts/ \; 2>/dev/null || true
          [ -f build-img.log ] && cp build-img.log artifacts/ || true
          [ -f build-dtbo.log ] && cp build-dtbo.log artifacts/ || true
          ls -lh artifacts/ || echo "no artifacts"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raphael-kernel-inject
          path: artifacts/
          retention-days: 30
